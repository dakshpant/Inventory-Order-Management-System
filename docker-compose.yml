services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-inventory}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  frontend:
    build:
      context: ../FE
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data:
